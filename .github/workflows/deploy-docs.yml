name: Deploy Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Least-privilege token for the official GitHub Pages deployment (no gh-pages
# branch push). Replaces the peaceiris/legacy-branch-build flow, whose legacy
# GitHub Pages build could hang in "building" and silently never publish new
# pages (old pages kept serving from the last good build).
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight deploy finish rather
# than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Build docs
        env:
          VITEPRESS_BASE: /ColliderML/
          # Static site has no dev proxy, so the bundle must call the backend's
          # absolute URL (copilot + workflow builder). Public URL.
          VITE_COLLIDERML_BACKEND: https://colliderml-backend.onrender.com
        run: npm run --prefix docs docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
